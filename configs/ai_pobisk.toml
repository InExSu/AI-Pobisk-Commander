# ai_Pobisk — configuration
#
# TOML, not YAML: python 3.11+ ships `tomllib` in the stdlib, but has no YAML
# parser. Adding a YAML dependency would break the "clone and run" property.

# ── Meta model: the model ai_Pobisk itself reasons with ───────────────────────
# Separate from the worker: the worker writes code, the meta decides what to do
# next. It is called on every stop, so it must be fast and cheap.
[meta]
max_tokens = 512
timeout_sec = 90
require_json = true
# Re-ask once if the answer is not JSON, then fall back to rules.
max_reparse = 1

# Tried in order; the first one that answers becomes the meta model.
[[meta.candidates]]
skill = "nvidia"
model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
note = "fast, small, healthy"

[[meta.candidates]]
skill = "nvidia"
model = "z-ai/glm-5.3-flash"
note = "S+ but slow (60-130s cold)"

[[meta.candidates]]
skill = "tokenharbor"
model = "qwen3.8-flash:free"
note = "AA #19, cheap"

# ── Fallback when the meta model is unreachable ───────────────────────────────
# Degrade, never freeze. `rules_only` uses the classify.py table with no LLM.
[fallback]
on_meta_unavailable = "rules_only"
# If the meta says fatal with confidence below this, treat it as recoverable
# and try rotating instead of stopping.
fatal_confidence_floor = 0.7

# ── Budgets: hard caps, no infinite loops ─────────────────────────────────────
[budget]
max_retries_per_step = 3
max_model_rotations = 10
max_account_rotations = 5
max_meta_calls_per_task = 40
# Wall clock for the WHOLE run (all tasks), not per task. Four tasks on a
# 44k-file repo at ~10 min each needs hours, not one hour.
max_wall_clock_sec = 21600
max_steps_per_task = 50
# Absolute backstop on attempts within one step. Meta verdicts and invariant
# rotations can both ask for "try again"; this bounds them so a wrong verdict
# costs a bounded amount instead of hanging the run.
max_iterations_per_step = 40
# A model that reports ok but leaves the target repo unchanged ("done" after
# only analysing) gets the step re-dispatched to the NEXT model this many
# times before the step is flagged needs_review for the owner. One live run
# halted a task on the first fake "done" while the rest of the fleet was idle.
max_no_evidence_per_step = 3
# How many times to answer a confirmation prompt before giving up. A model
# looping on "Press Enter" would otherwise be nudged forever.
max_nudges_per_step = 5
# When every worker in the list is out, the supervisor lifts transient
# cooldowns and walks the list again — a model in a 15-minute cooldown is not
# a dead fleet. `auth_error` stays parked. This caps that search: two rounds,
# then `exhausted`, so a genuinely dead fleet cannot spin.
max_rediscoveries = 2
# Attempts faster than this are configuration failures (missing binary, bad
# path), not real work — the supervisor paces them instead of spinning.
min_step_ms = 2000
# Per-step wall clock. A real agent (cline/opencode) reads files, runs tests
# and edits code: 10 min is a normal task, not a hang. The 600s default was
# cutting real work off mid-flight and reporting it as a model failure.
#
# 2 hours, because a task on igrasu.ru (19 GB, 53k files) is not "a normal
# task": integrating one game took 30+ minutes of exploration alone, and the
# 1800s cap cut it mid-integration. The overall run is still bounded by
# max_wall_clock_sec above, so a genuinely hung model cannot run forever.
step_timeout_sec = 7200

# ── Concurrency ───────────────────────────────────────────────────────────────
# Tasks are independent markdown files, so several can run at once — but only
# one agent may touch a given task, and two agents editing the same repo at the
# same time would corrupt it. So:
#   * parallelism is ACROSS tasks, never within one task;
#   * each task is locked to one skill for its whole run;
#   * the cap is clamped to the number of available workers
#     (tasks > agents -> they queue; tasks < agents -> extra agents idle).
#
# same_repo_guard: when every task resolves to the SAME target repo, parallel
# runs are unsafe (concurrent edits to shared files), so it degrades to 1.
# Set false only when your tasks touch disjoint paths.
[parallel]
enabled = true
max_parallel_tasks = 3
same_repo_guard = true

# ── Worker dispatch order ─────────────────────────────────────────────────────
# First available wins; on rotate_account/rotate_model the supervisor walks on.
#
# ORDER IS BY CAPABILITY, NOT BY RELIABILITY.
# cline/opencode run a real agent with file tools (read/grep/edit/shell) — they
# can actually do a task. nvidia/tokenharbor are bare chat-completion calls:
# the model has NO filesystem, so "read AGENTS.md and run the tests" is
# impossible for them and they answer "I cannot access your files" — which
# looks like success (exit 0, polite prose) and silently completes nothing.
# Agent skills first; API skills only as a last resort.
#
# On top of the order, a step that changes files on disk never reaches the
# API workers at all: they are dropped from that step's worker list (see
# workers.no_filesystem below). Text steps still use them — that is the one
# thing they are good at.
[workers]
# Только скиллы с файловой системой (могут читать/писать/запускать код).
# nvidia/tokenharbor — bare chat-completion API, без инструментов.
order = ["cline", "opencode", "kilo"]
# freebuff — TUI без prompt mode; nvidia/tokenharbor/kilo — только текст, без ФС.
non_workers = ["freebuff", "nvidia", "tokenharbor", "kilo"]

# A bare API call cannot use tools. When the reply says so, treat it as
# "this worker cannot do it" and move on rather than recording success.
[workers.no_filesystem]
# Patterns that mean: the model has no access to the target files.
patterns = [
  "I don't have access to (your |the )?(file|filesystem|local files)",
  "I do not have access to (your |the )?(file|filesystem|local files)",
  "I cannot access (your |the )?(file|filesystem|local files|that path)",
  "I can't access (your |the )?(file|filesystem|local files|that path)",
  "no access to (the |your )?file",
  "does not contain that path",
  "не имею доступа к файловой системе",
  "нет доступа к файл",
  "cannot directly access",
  "if you can paste the contents",
]
# Skills whose calls are bare completions (no tools) — the check applies.
# These are dropped from the worker list of any step that edits files.
# The adapters also declare `has_filesystem = False`; the two are unioned, so
# this list can only ever exclude a worker, never mis-route file work.
skills = ["nvidia", "tokenharbor", "kilo"]

# ── Capability routing ────────────────────────────────────────────────────────
# How the supervisor decides that a step needs to change files on disk.
#
# Most precise signal first:
#   1. an explicit directive in the task body — `# requires: filesystem` or
#      `# requires: text`. The author of the task always wins.
#   2. the task names a directory that exists (that is the repo the work is
#      about, so the work happens in files).
#   3. the words below.
#
# Both ways of being wrong are harmless: a text task misread as a file task
# only skips the API workers, and a file task misread as a text task is caught
# by workers.no_filesystem.patterns when the worker admits it cannot see the
# files. So the list is kept narrow on purpose — "code" and "translate" are
# NOT in it, because a pure text task about code is exactly what an API
# worker is good at.
[capabilities]
file_task_keywords = [
  "файл", "репозитор", "репозиторий", "коммит", "пуш", "ветк", "папк",
  "директор", "git",
  "file", "repo", "commit", "push", "branch", "folder", "directory",
  "filename",
]

# ── Questions from the model ──────────────────────────────────────────────────
[questions]
# Files that define ai_Pobisk's competence. A question answerable from these is
# answered without involving the owner.
auto_answer_from = ["AGENTS.md", "README.md", "configs/", "docs/"]
ask_owner_when_confidence_below = 0.6
max_pending = 3
owner_timeout_sec = 600

# ── Code-graph context (Graft) ────────────────────────────────────────────────
# Graft maps a repo into a folder of linked markdown cards, and ai_Pobisk can
# prepend a short map to the worker prompt so it starts oriented instead of
# exploring from scratch. Their benchmark: ~42% fewer tokens, ~46% fewer tool
# calls. That number is from their repo, not from here — measure before trusting.
#
# OFF BY DEFAULT, for three measured reasons:
#   1. The tasks point at igrasu.ru: 19 GB, 53 505 files. A graph there is not
#      a prompt prefix, it is a project; and graft/ is not gitignored there, so
#      it would litter a repo that is not ours.
#   2. `graft ask` indexes identifiers and English prose. Russian questions
#      return zero hits (measured), and every task file here is Russian — so
#      the expensive half of the integration is a guaranteed miss.
#   3. It is the only non-stdlib dependency in the project. "Clone and run"
#      beats a maybe-42% on a repo that has no graph.
#
# Turn it on for a small, English-language repo you own:
#   enabled = true, then `./ai_Pobisk.sh graft build` in that repo.
# Missing CLI or missing graph degrades to a plain prompt — never an error.
[graft]
enabled = false
# Which repo to map. "" = the repo the task names in its body, else this one.
repo = ""
# Cap on the prepended block, in characters.
max_context_chars = 4000

# ── Paths: platform-specific locations ─────────────────────────────────────────
# All paths are resolved relative to repo root unless absolute; "~" expands.
# On Windows both backslashes and forward slashes work. state_dir is projected
# onto [state].dir when set (see src/config.py::_apply_paths) — set either one,
# not both.
[paths]
# State directory for journals, state, events (relative to repo root).
state_dir = ".ai_pobisk"
# Browser binaries directory (relative to repo root).
browsers_dir = ".playwright"
# Python venv directory (relative to repo root).
venv_dir = ".venv"
# Directory where cline/opencode/etc. accounts live (absolute or relative).
accounts_dir = "~/.cline/accounts"
# Directory where model health stats are stored (absolute or relative).
model_stats_dir = "~/.ai-rotate"
# Directory where secrets are stored (absolute or relative).
secrets_dir = "~/.ai-rotate"

# ── Tasks ─────────────────────────────────────────────────────────────────────
[tasks]
dir = "configs/tasks"
# Completed task files are archived here (moved, not deleted) so reruns of
# `state.json` never pick them up by hash again.
disabled = "configs/disabled"
# Empty markdown files are skipped with a note, not treated as failures.
skip_empty = true

# ── Monitoring ────────────────────────────────────────────────────────────────
# Events go to .ai_pobisk/events.jsonl (one JSON per line). `status --live`,
# `watch`, `check`, `serve` and `report` all read it; nothing else is needed.
[monitor]
# Share of attempts ending fatal/loop_guard before we call it a config problem.
max_fatal_share = 0.3
# Total nudges per run before "the model is stuck asking for confirmation".
max_nudges_total = 6
# Parked (auth_error) models collapse rotation depth silently. Flag when a
# skill has more than this many.
max_auth_error_models = 8
# Shell command run when `check` finds issues (e.g. a Telegram ping).
notify_cmd = ""

# ── State ─────────────────────────────────────────────────────────────────────
[state]
dir = ".ai_pobisk"
journal = "journal.md"
state_file = "state.json"

# ── Mail: where confirmation letters arrive ───────────────────────────────────
# Used by `signup` when a site sends a code or a "confirm your address" link.
# Only the coordinates live here. The password comes from
# AI_POBISK_IMAP_PASSWORD or the 0600 store (~/.ai-rotate/secrets.json):
#   python3 .agents/skills/_shared/secrets.py set imap_gh1 'пароль-ящика'
# Handyhost, domain igrasu.ru: IMAP mail.igrasu.ru:993 SSL, SMTP 465 SSL.
# The folder is opened read-only — the agent never marks your mail as read.
[mail]
host = "mail.igrasu.ru"
port = 993
ssl = true
user = "gh1@igrasu.ru"
folder = "INBOX"
# Name of the key in the shared secret store (not the password itself).
password_secret = "imap_gh1"
# How often to poll while waiting for a letter, and how long to wait in total.
poll_sec = 5
timeout_sec = 180
# Escape hatch for sites with an unusual code format, e.g. "код\\s*[:—-]\\s*(\\w+)"
code_regex = ""

# ── Signup: an AI that fills forms on sites that have no API ──────────────────
# The loop is: snapshot -> decide -> act -> snapshot. The model decides where a
# value goes; this program decides what the value is (placeholders are resolved
# in code, so the password never enters a prompt).
[signup]
# Who we are. Personal data, so the file is gitignored; start from the example:
#   cp configs/profile.example.toml configs/profile.toml
profile = "configs/profile.toml"
# Creating accounts is opt-in twice: allow_live here AND --yes on the command.
# Without them every run is a dry run that only prints the first planned step.
allow_live = true
# Headless by default: the browser must work in the background and never steal
# focus. `signup --headed` opens a window for the one case that needs a human
# (a captcha), and `login` always opens one — that command exists for OAuth.
headless = true
max_steps = 40
# Model calls per registration. Rules handle the ordinary form without any.
max_llm_calls = 25
llm_timeout_sec = 60
# Below this confidence the loop stops and asks instead of clicking.
min_confidence = 0.35
# How long to wait for the code letter before giving up.
mail_timeout_sec = 180
# Captcha, SMS code, payment -> "blocked", i.e. a question to the owner.
# Solving them is a ToS violation and an arms race; the agent does not try.
stop_on_blockers = true
# Tick the "I accept the terms" box. Every tick is written to the trace.
accept_terms = true
max_wall_clock_sec = 600
# Empty -> reuse [meta.candidates]. A cheap model is enough: one action per step.
candidates = []
