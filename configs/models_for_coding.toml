# models_for_coding.toml — рейтинг моделей для целей программирования.
#
# Чем выше число, тем лучше модель подходит для кодинга (по мнению владельца).
# Используется супервайзером ai_Pobisk при выборе модели для шага:
#   * первый вызов модели берёт модель с наивысшим рейтингом;
#   * при rotate_model берётся следующая по убыванию рейтинга.
#
# Имена моделей пишутся так, как они передаются в -m (с префиксом скилла:
# "nvidia/nemotron-3-super-120b-a12b", "kilo/nvidia/nemotron-3.5-super-vl:free",
# "cline-free/deepseek-v4.1-flash" и т.д.). Неизвестная модель получает
# default.score (см. секцию [default]).

[default]
score = 50

[models]
# ── Лучшие для программирования (топ-класс) ─────────────────────────────────
"nvidia/nemotron-3-super-120b-a12b" = 100
"nvidia/nemotron-3-super-120b-a12b:free" = 100
